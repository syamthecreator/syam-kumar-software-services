<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="grad-electric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with subtle border -->
  <rect width="64" height="64" rx="14" fill="url(#grad-bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="url(#grad-electric)" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Stylized Monogram SK with Code Bracket feel -->
  <!-- Left bracket / S flow -->
  <path d="M26 18C22 18 18 21 18 25C18 29 22 31 26 32C30 33 34 35 34 39C34 43 30 46 26 46C21 46 17 43 16 39" 
        stroke="url(#grad-electric)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- K diagonal cuts -->
  <path d="M38 18V46" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M48 20L38 32L49 46" stroke="url(#grad-electric)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Modern accent dot -->
  <circle cx="50" cy="18" r="2.5" fill="#38BDF8"/>
</svg>
